<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Data centre logo">
  <!-- Isometric server block: top, left and right faces -->
  <polygon points="60,10 104,35 60,60 16,35" fill="#FFD9B0"/>
  <polygon points="16,35 60,60 60,110 16,85" fill="#F2A65A"/>
  <polygon points="60,60 104,35 104,85 60,110" fill="#D9774A"/>
  <!-- Server slots on the left face -->
  <g fill="#FFF4E6" opacity="0.9">
    <polygon points="23,47 53,64 53,69 23,52"/>
    <polygon points="23,59 53,76 53,81 23,64"/>
    <polygon points="23,71 53,88 53,93 23,76"/>
  </g>
  <!-- Status lights on the right face -->
  <g fill="#FFF4E6">
    <circle cx="70" cy="66" r="2.6"/><circle cx="78" cy="61.5" r="2.6"/>
    <circle cx="70" cy="78" r="2.6"/><circle cx="78" cy="73.5" r="2.6"/>
    <circle cx="70" cy="90" r="2.6"/><circle cx="78" cy="85.5" r="2.6"/>
  </g>
  <!-- Lightning bolt on the top face -->
  <polygon points="64,20 47,37 58,37 54,50 73,31 62,31 67,20" fill="#FFF3B0" stroke="#C46A10" stroke-width="2" stroke-linejoin="round"/>
</svg>
